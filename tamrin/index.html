<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه تمرینی اختصاصی و سیستم مدیریت جلسات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: #111622;
      --card-border: #1e2638;
      --accent-orange: #ff5e36;
      --accent-cyan: #00f2fe;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --surface: #182030;
      --table-header: #151c2c;
      --table-row-alt: #0d121c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      padding: 12px;
    }

    main {
      max-width: 1450px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* تب‌های روزهای تمرینی، چک‌باکس روز و دکمه + استراحت */
    .day-tabs {
      display: flex;
      align-items: stretch;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding: 4px 2px 6px 2px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-card {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      min-width: 148px;
      flex: 1;
      position: relative;
      user-select: none;
    }

    .tab-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .tab-card-title {
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .day-check-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-checkbox {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin: 0;
    }

    .tab-card span.day-tag {
      font-size: 0.68rem;
      opacity: 0.85;
      font-weight: 500;
      white-space: nowrap;
      text-align: right;
    }

    .tab-card:hover {
      border-color: rgba(255, 94, 54, 0.5);
      color: var(--text-main);
    }

    .tab-card.active {
      background: linear-gradient(135deg, rgba(255, 94, 54, 0.25) 0%, rgba(255, 94, 54, 0.08) 100%);
      border-color: var(--accent-orange);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 94, 54, 0.2);
    }

    .tab-card.active span.day-tag {
      color: var(--accent-orange);
    }

    .tab-card.completed {
      border-color: rgba(16, 185, 129, 0.55);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14) 0%, var(--surface) 100%);
    }

    .tab-card.completed.active {
      background: linear-gradient(135deg, rgba(255, 94, 54, 0.22) 0%, rgba(16, 185, 129, 0.14) 100%);
      border-color: var(--accent-orange);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .tab-card.completed .tab-card-title {
      color: #6ee7b7;
    }

    /* دکمه + افزودن روز استراحت کنار هر روز */
    .add-rest-btn {
      background: rgba(168, 85, 247, 0.08);
      border: 1px dashed rgba(168, 85, 247, 0.35);
      color: #c084fc;
      border-radius: 10px;
      width: 28px;
      min-width: 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
    }

    .add-rest-btn:hover {
      background: rgba(168, 85, 247, 0.24);
      border-color: var(--accent-purple);
      color: #fff;
      transform: scale(1.05);
    }

    .rest-slot {
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #e9d5ff;
      border-radius: 12px;
      min-width: 96px;
      padding: 8px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      position: relative;
    }

    .rest-slot:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(248, 113, 113, 0.6);
      color: #fecaca;
    }

    .rest-remove-hint {
      font-size: 0.6rem;
      opacity: 0.75;
    }

    /* جدول ستونی تفکیک‌شده و قابل جابه‌جایی حرکات */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    .superset-legend {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #e9d5ff;
      border-radius: 10px;
      padding: 7px 12px;
      margin-bottom: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .superset-legend.visible {
      display: flex;
    }

    table.workout-table {
      width: 100%;
      min-width: 1500px;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.78rem;
    }

    table.workout-table th {
      background: var(--table-header);
      color: #e2e8f0;
      font-weight: 800;
      padding: 8px 8px 6px 8px;
      border-bottom: 2px solid var(--card-border);
      border-left: 1px solid var(--card-border);
      white-space: nowrap;
      font-size: 0.73rem;
      cursor: grab;
      user-select: none;
      transition: background 0.15s, box-shadow 0.15s;
      vertical-align: middle;
    }

    table.workout-table th:hover {
      background: #1c253b;
    }

    table.workout-table th.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    table.workout-table th.drag-over {
      background: rgba(0, 242, 254, 0.16);
      box-shadow: inset 0 -3px 0 var(--accent-cyan);
    }

    table.workout-table th:last-child {
      border-left: none;
    }

    .th-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .th-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .th-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.55;
      transition: opacity 0.15s;
    }

    table.workout-table th:hover .th-controls,
    table.workout-table th:focus-within .th-controls {
      opacity: 1;
    }

    .th-move-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      border-radius: 4px;
      width: 18px;
      height: 16px;
      font-size: 0.68rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .th-move-btn:hover:not(:disabled) {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
    }

    .th-move-btn:disabled {
      opacity: 0.2;
      cursor: default;
    }

    .th-drag-grip {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: -1px;
      padding: 0 2px;
    }

    .th-reset-btn {
      background: rgba(255, 94, 54, 0.15);
      border: 1px solid rgba(255, 94, 54, 0.35);
      color: #ff9f7f;
      border-radius: 4px;
      font-size: 0.66rem;
      padding: 0 4px;
      cursor: pointer;
      line-height: 1.3;
    }

    .th-reset-btn:hover {
      background: var(--accent-orange);
      color: #fff;
    }

    table.workout-table td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--card-border);
      border-left: 1px solid var(--card-border);
      vertical-align: middle;
      color: #cbd5e1;
      line-height: 1.55;
    }

    table.workout-table td:last-child {
      border-left: none;
    }

    table.workout-table tr:nth-child(even):not(.superset-row) td {
      background-color: var(--table-row-alt);
    }

    table.workout-table tr:hover:not(.superset-row) td {
      background-color: rgba(255, 94, 54, 0.04);
    }

    /* ردیف‌های سوپرست با اتصال بصری واضح */
    table.workout-table tr.superset-row td {
      background-color: rgba(168, 85, 247, 0.07) !important;
    }

    table.workout-table tr.superset-row:hover td {
      background-color: rgba(168, 85, 247, 0.13) !important;
    }

    table.workout-table tr.superset-start td {
      border-top: 2px solid rgba(168, 85, 247, 0.55);
      border-bottom: 1px dashed rgba(168, 85, 247, 0.45);
    }

    table.workout-table tr.superset-end td {
      border-bottom: 2px solid rgba(168, 85, 247, 0.55);
    }

    table.workout-table tr.superset-row td:first-child {
      border-right: 4px solid var(--accent-purple);
    }

    table.workout-table tr.superset-row td.col-idx {
      background: rgba(168, 85, 247, 0.14) !important;
      color: #e9d5ff;
    }

    table.workout-table tr.move-done td {
      background-color: rgba(16, 185, 129, 0.08) !important;
    }

    table.workout-table tr.move-done:not(.superset-row) td:first-child {
      border-right: 3px solid var(--accent-green);
    }

    table.workout-table tr.move-done:not(.superset-row) td.col-idx {
      background: rgba(16, 185, 129, 0.14) !important;
      color: #6ee7b7;
    }

    table.workout-table tr.move-done .col-execution,
    table.workout-table tr.move-done .col-name-en {
      opacity: 0.72;
    }

    .superset-pill {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 5px;
      border-radius: 5px;
      font-size: 0.61rem;
      font-weight: 800;
      line-height: 1.25;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #f3e8ff;
      white-space: nowrap;
    }

    .superset-arrow {
      display: block;
      font-size: 0.62rem;
      color: #c084fc;
      margin-top: 3px;
      font-weight: 700;
    }

    /* ستون‌های مجزا و تخصصی */
    .col-idx {
      width: 78px;
      text-align: center !important;
      font-weight: 800;
      color: var(--accent-orange);
      background: rgba(255, 94, 54, 0.05);
    }

    .idx-check-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .move-checkbox {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
    }

    .col-muscle {
      min-width: 135px;
      text-align: center !important;
    }

    .muscle-chip {
      display: inline-block;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 94, 54, 0.14);
      border: 1px solid rgba(255, 94, 54, 0.3);
      color: #ff9f7f;
    }

    .col-targets {
      min-width: 210px;
    }

    .muscle-breakdown {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .muscle-target-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 6px;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .muscle-target-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .muscle-fa {
      font-size: 0.72rem;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.3;
    }

    .muscle-en {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--accent-cyan);
      direction: ltr;
      text-align: left;
      opacity: 0.9;
      line-height: 1.25;
    }

    .muscle-target-pct {
      font-weight: 800;
      font-size: 0.69rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0 5px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .col-muscle-2d {
      width: 145px;
      min-width: 145px;
      text-align: center !important;
      padding: 6px !important;
      background: rgba(10, 14, 23, 0.55);
    }

    .svg-2d-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .svg-2d-wrap svg {
      width: 130px;
      height: 106px;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    }

    .svg-2d-labels {
      display: flex;
      justify-content: space-around;
      width: 100%;
      font-size: 0.58rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* نوار کوچک زیر جدول برای مدیریت و کپی چیدمان ستون‌ها */
    .col-order-footer {
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.71rem;
      color: var(--text-muted);
    }

    .col-order-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .footer-mini-btn {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .footer-mini-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .footer-mini-btn.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-green);
      color: #34d399;
    }

    .col-name-en {
      min-width: 165px;
      direction: ltr;
      text-align: left !important;
      font-weight: 700;
      font-size: 0.74rem;
      color: var(--accent-cyan);
      letter-spacing: 0.1px;
    }

    .col-posture {
      min-width: 118px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.74rem;
      text-align: center !important;
    }

    .angle-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 0.67rem;
      font-weight: 700;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fcd34d;
    }

    .col-equip {
      min-width: 120px;
      color: #cbd5e1;
      font-size: 0.74rem;
      font-weight: 600;
    }

    .col-execution {
      min-width: 225px;
      font-weight: 500;
      color: #f8fafc;
      font-size: 0.74rem;
    }

    .col-sets {
      width: 62px;
      text-align: center !important;
      font-weight: 900;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
      white-space: nowrap;
      font-size: 0.8rem;
    }

    .col-reps {
      width: 82px;
      text-align: center !important;
      font-weight: 900;
      color: #34d399;
      background: rgba(16, 185, 129, 0.05);
      white-space: nowrap;
      font-size: 0.77rem;
    }

    .col-tempo {
      width: 78px;
      text-align: center !important;
      direction: ltr;
      font-family: monospace, sans-serif;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .col-tips {
      min-width: 215px;
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .col-tips strong {
      color: #fbbf24;
    }

    @media (max-width: 768px) {
      .day-tabs {
        padding-bottom: 6px;
      }
      .tab-card {
        min-width: 132px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>

  <main>
    <!-- تب‌های روزها همراه با چک‌باکس روز و دکمه + استراحت -->
    <div class="day-tabs" id="dayTabsContainer">
      <!-- توسط جاوااسکریپت پر می‌شود -->
    </div>

    <!-- راهنمای سوپرست (فقط در روزهای دارای سوپرست نمایش داده می‌شود) -->
    <div class="superset-legend" id="supersetLegend">
      <span>⚡ ردیف‌های بنفش متصل به هم «سوپرست» هستند: حرکت اول را که زدی، بدون استراحت بلافاصله حرکت دوم را انجام بده و بعد استراحت کن.</span>
    </div>

    <!-- جدول ستونی مجزا، تفکیک‌شده و قابل جابه‌جایی -->
    <div class="table-container">
      <table class="workout-table">
        <thead id="tableHead">
          <!-- توسط جاوااسکریپت بر اساس ترتیب ستون‌ها پر می‌شود -->
        </thead>
        <tbody id="tableBody">
          <!-- توسط جاوااسکریپت پر می‌شود -->
        </tbody>
      </table>
    </div>

    <!-- نوار کوچک زیر جدول برای جابه‌جایی و ثبت چیدمان دلخواه ستون‌ها -->
    <div class="col-order-footer">
      <span id="colOrderSummary">چیدمان فعلی: در حال بارگذاری...</span>
      <div class="col-order-actions">
        <button type="button" class="footer-mini-btn" id="copyOrderBtn" onclick="copyColumnOrder()">📋 کپی چیدمان برای ارسال</button>
        <button type="button" class="footer-mini-btn" onclick="resetColumnOrder()">↺ چیدمان پیش‌فرض</button>
      </div>
    </div>
  </main>

  <script>
    // اطلاعات ۵ روز برنامه با ستون‌های تفکیک‌شده دقیق، درصد عضلات و سوپرست‌های مجزا
    const programData = {
      1: {
        title: "شنبه (روز اول): زیربغل، کول، سرشانه، جلوبازو و کرانچ (اجرا شده)",
        exercises: [
          {
            order: "۱",
            muscle: "زیربغل (پهنای پشت)",
            targets: [
              { fa: "پهن‌کننده پشت", en: "Latissimus Dorsi", pct: "۶۵٪" },
              { fa: "گرد بزرگ", en: "Teres Major", pct: "۱۵٪" },
              { fa: "پشت سرشانه", en: "Posterior Deltoid", pct: "۱۰٪" },
              { fa: "دوسر بازو", en: "Biceps Brachii", pct: "۱۰٪" }
            ],
            name_en: "Wide-Grip Pronated Lat Pulldown",
            posture: "نشسته (پد ران)",
            angle: "تنه ۱۰۵° متمایل به عقب",
            equipment: "دستگاه سیم‌کش لت (میله بلند)",
            execution: "دست‌ها بازتر از عرض شانه و کف دست رو به جلو؛ سینه را بالا بده، آرنج‌ها را عمودی رو به پایین بکش تا میله به بالای سینه برسد و آرام برگردان.",
            sets: "۴",
            reps: "۱۲ تکرار",
            tempo: "۱-۱-۳-۱",

      'idx',

    const PCT_FA_DIGITS = { '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9' };
    function parsePctNum(pctStr) {
      if (typeof pctStr === 'number') return pctStr;
      if (!pctStr) return 0;
      const en = String(pctStr).replace(/[۰-۹]/g, c => PCT_FA_DIGITS[c]).replace(/[^0-9.]/g, '');
      return Number(en) || 0;
    }

    function extractMuscleHeat(ex) {
      const heat = {
        upper_traps: 0, mid_traps: 0, lats: 0,
        front_delts: 0, side_delts: 0, rear_delts: 0,
        upper_chest: 0, mid_chest: 0, lower_chest: 0,
        biceps: 0, triceps: 0,
        forearm_front: 0, forearm_back: 0, wrist_hand: 0,
        upper_abs: 0, lower_abs: 0, obliques: 0, erector: 0,
        glutes: 0, quads: 0, adductors: 0, abductors: 0,
        hamstrings: 0, tibialis: 0, calves: 0
      };
      const add = (k, v) => { heat[k] = Math.min(100, heat[k] + v); };

      (ex.targets || []).forEach(t => {
        const val = t.val !== undefined ? t.val : parsePctNum(t.pct);
        const en = (t.en || t.name || '').toLowerCase();

        if (en.includes('latissimus') || en.includes('teres major')) add('lats', val);
        else if (en.includes('mid trapezius') || en.includes('rhomboids')) add('mid_traps', val);
        else if (en.includes('upper trapezius') || en.includes('levator scapulae')) add('upper_traps', val);
        else if (en.includes('anterior deltoid')) add('front_delts', val);
        else if (en.includes('lateral deltoid') || en.includes('supraspinatus')) add('side_delts', val);
        else if (en.includes('posterior deltoid') || en.includes('infraspinatus')) add('rear_delts', val);
        else if (en.includes('clavicular pectoralis') || en.includes('upper pectoralis')) add('upper_chest', val);
        else if (en.includes('lower pectoralis')) add('lower_chest', val);
        else if (en.includes('pectoralis')) add('mid_chest', val);
        else if (en.includes('biceps brachii') || en.includes('biceps long') || en.includes('brachialis')) add('biceps', val);
        else if (en.includes('triceps')) add('triceps', val);
        else if (en.includes('brachioradialis')) { add('forearm_front', val * 0.85); add('forearm_back', val * 0.85); }
        else if (en.includes('extensor digitorum longus') || en.includes('tibialis anterior')) add('tibialis', val);
        else if (en.includes('soleus') || en.includes('gastrocnemius')) add('calves', val);
        else if (en.includes('flexor digitorum') && (ex.name_en || '').toLowerCase().includes('calf')) add('calves', val * 0.6);
        else if (en.includes('extensor carpi') || en.includes('extensor digitorum')) { add('forearm_back', val); if (en.includes('digitorum')) add('wrist_hand', val * 0.5); }
        else if (en.includes('flexor carpi') || en.includes('flexor digitorum')) { add('forearm_front', val); if (en.includes('digitorum')) add('wrist_hand', val * 0.65); }
        else if (en.includes('carpi radialis')) { add('forearm_front', val * 0.65); add('forearm_back', val * 0.65); add('wrist_hand', val * 0.75); }
        else if (en.includes('supinator') || en.includes('pronator')) { add('forearm_front', val * 0.8); add('forearm_back', val * 0.8); }
        else if (en.includes('pollicis') || en.includes('finger') || en.includes('lumbricals')) { add('wrist_hand', val); if (en.includes('abductor pollicis')) add('forearm_front', val * 0.4); }
        else if (en.includes('upper rectus abdominis')) add('upper_abs', val);
        else if (en.includes('lower rectus abdominis') || en.includes('iliopsoas')) add('lower_abs', val);
        else if (en.includes('rectus abdominis')) { add('upper_abs', val * 0.75); add('lower_abs', val * 0.75); }
        else if (en.includes('obliques')) add('obliques', val);
        else if (en.includes('erector spinae') || en.includes('multifidus')) add('erector', val);
        else if (en.includes('gluteus maximus')) add('glutes', val);
        else if (en.includes('gluteus medius') || en.includes('gluteus minimus') || en.includes('tensor fasciae')) add('abductors', val);
        else if (en.includes('vastus') || en.includes('rectus femoris')) add('quads', val);
        else if (en.includes('adductor') || en.includes('gracilis')) add('adductors', val);
        else if (en.includes('biceps femoris') || en.includes('semitendinosus') || en.includes('semimembranosus')) add('hamstrings', val);
      });
      return heat;
    }

    function heatAttr(pct) {
      if (!pct || pct <= 0) {
        return 'fill="#1d2638" stroke="#2d3a52" stroke-width="0.55"';
      }
      const c = Math.min(100, Math.max(5, pct));
      let fill, stroke, op;
      if (c >= 60) {
        fill = '#ff1e2d';
        stroke = '#ff9aa2';
        op = '0.96';
      } else if (c >= 35) {
        fill = '#e62e3d';
        stroke = '#ff707d';
        op = '0.78';
      } else if (c >= 18) {
        fill = '#dc3c49';
        stroke = '#f87171';
        op = '0.52';
      } else {
        fill = '#f87171';
        stroke = '#fca5a5';
        op = '0.32';
      }
      return `fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width="${c >= 55 ? '1.05' : '0.7'}"`;
    }

    function renderMuscle2D(ex) {
      const h = extractMuscleHeat(ex);
      const isRightOnly = ex.side === 'right';
      const qR = heatAttr(h.quads);
      const qL = heatAttr(isRightOnly ? 0 : h.quads);
      const tR = heatAttr(h.tibialis);
      const tL = heatAttr(isRightOnly ? 0 : h.tibialis);
      const hamR = heatAttr(h.hamstrings);
      const hamL = heatAttr(isRightOnly ? 0 : h.hamstrings);
      const calR = heatAttr(h.calves);
      const calL = heatAttr(isRightOnly ? 0 : h.calves);

      return `
        <div class="svg-2d-wrap">
          <svg viewBox="0 0 180 144" xmlns="http://www.w3.org/2000/svg" aria-label="2D Muscle Map">
            <!-- نمای جلو (مرکز x=45) -->
            <g>
              <!-- سر و گردن و سایه پایه بدن جلو -->
              <ellipse cx="45" cy="11" rx="6" ry="7.5" fill="#171f30" stroke="#2c3850" stroke-width="0.7"/>
              <path d="M41 18 L49 18 L51 24 L39 24 Z" fill="#171f30"/>
              <!-- کول جلو -->
              <path d="M41 19 L31 25 L39 26 Z" ${heatAttr(h.upper_traps)}/>
              <path d="M49 19 L59 25 L51 26 Z" ${heatAttr(h.upper_traps)}/>
              <!-- سرشانه جلویی و میانی -->
              <path d="M29 25 Q33 24 35 28 L33 36 Q28 36 27 31 Z" ${heatAttr(h.front_delts)}/>
              <path d="M61 25 Q57 24 55 28 L57 36 Q62 36 63 31 Z" ${heatAttr(h.front_delts)}/>
              <path d="M25 27 Q27 24 29 26 L27 36 Q24 35 25 27 Z" ${heatAttr(h.side_delts)}/>
              <path d="M65 27 Q63 24 61 26 L63 36 Q66 35 65 27 Z" ${heatAttr(h.side_delts)}/>
              <!-- بالاسینه -->
              <path d="M44 25 L34 26 L34 31 L44 30 Z" ${heatAttr(h.upper_chest)}/>
              <path d="M46 25 L56 26 L56 31 L46 30 Z" ${heatAttr(h.upper_chest)}/>
              <!-- میانه سینه -->
              <path d="M44 30.5 L34 31.5 L34 38 L44 38 Z" ${heatAttr(h.mid_chest)}/>
              <path d="M46 30.5 L56 31.5 L56 38 L46 38 Z" ${heatAttr(h.mid_chest)}/>
              <!-- زیرسینه -->
              <path d="M44 38.5 L34 38.5 Q39 42.5 44 40.5 Z" ${heatAttr(h.lower_chest)}/>
              <path d="M46 38.5 L56 38.5 Q51 42.5 46 40.5 Z" ${heatAttr(h.lower_chest)}/>
              <!-- جلوبازو -->
              <path d="M26 36 L31 37 L27 52 L21 51 Z" ${heatAttr(h.biceps)}/>
              <path d="M64 36 L59 37 L63 52 L69 51 Z" ${heatAttr(h.biceps)}/>
              <!-- ساعد جلو -->
              <path d="M21 52.5 L26.5 53 L21.5 70 L16.5 69 Z" ${heatAttr(h.forearm_front)}/>
              <path d="M69 52.5 L63.5 53 L68.5 70 L73.5 69 Z" ${heatAttr(h.forearm_front)}/>
              <!-- مچ و پنجه جلو -->
              <path d="M16 70.5 L21 71 L18.5 80.5 L13.5 79 Z" ${heatAttr(h.wrist_hand)}/>
              <path d="M74 70.5 L69 71 L71.5 80.5 L76.5 79 Z" ${heatAttr(h.wrist_hand)}/>
              <!-- شکم بالا و پایین -->
              <rect x="40" y="42" width="10" height="12.5" rx="2" ${heatAttr(h.upper_abs)}/>
              <path d="M40 55.5 L50 55.5 L48.5 68 L41.5 68 Z" ${heatAttr(h.lower_abs)}/>
              <!-- پهلو (مورب شکمی) -->
              <path d="M35 42 L39.5 42 L39.5 66 L36.5 65 Z" ${heatAttr(h.obliques)}/>
              <path d="M55 42 L50.5 42 L50.5 66 L53.5 65 Z" ${heatAttr(h.obliques)}/>
              <!-- خارج ران (لبه لگن) -->
              <path d="M35 67 L31 76 L32 88 L35 86 Z" ${heatAttr(h.abductors)}/>
              <path d="M55 67 L59 76 L58 88 L55 86 Z" ${heatAttr(h.abductors)}/>
              <!-- چهارسر ران (راست سمت چپ تصویر / چپ سمت راست تصویر) -->
              <path d="M35 72 L42.5 72 L43 102 L34.5 102 Z" ${qR}/>
              <path d="M55 72 L47.5 72 L47 102 L55.5 102 Z" ${qL}/>
              <!-- داخل ران -->
              <path d="M42.5 73 L44.5 74 L43.5 96 L41.5 95 Z" ${heatAttr(h.adductors)}/>
              <path d="M47.5 73 L45.5 74 L46.5 96 L48.5 95 Z" ${heatAttr(h.adductors)}/>
              <!-- جلوی ساق پا (تیبیالیس) -->
              <path d="M35 105 L41.5 105 L40.5 132 L36 132 Z" ${tR}/>
              <path d="M55 105 L48.5 105 L49.5 132 L54 132 Z" ${tL}/>
              <!-- کف پا جلو -->
              <path d="M35.5 133 L41 133 L41 138 L34 138 Z" fill="#171f30" stroke="#2c3850" stroke-width="0.5"/>
              <path d="M54.5 133 L49 133 L49 138 L56 138 Z" fill="#171f30" stroke="#2c3850" stroke-width="0.5"/>
            </g>

            <!-- خط جداکننده ظریف بین جلو و پشت -->
            <line x1="90" y1="8" x2="90" y2="136" stroke="#263148" stroke-width="0.8" stroke-dasharray="2 2"/>

            <!-- نمای پشت (مرکز x=135) -->
            <g>
              <ellipse cx="135" cy="11" rx="6" ry="7.5" fill="#171f30" stroke="#2c3850" stroke-width="0.7"/>
              <!-- کول بالا (پشت) -->
              <path d="M131 18 L139 18 L149 26 L135 31 L121 26 Z" ${heatAttr(h.upper_traps)}/>
              <!-- پشت سرشانه -->
              <path d="M120 26 Q116 27 116 34 L123 36 L124 29 Z" ${heatAttr(h.rear_delts)}/>
              <path d="M150 26 Q154 27 154 34 L147 36 L146 29 Z" ${heatAttr(h.rear_delts)}/>
              <!-- میانه پشت و متوازی‌الاضلاع -->
              <path d="M125 30 L145 30 L142 46 L128 46 Z" ${heatAttr(h.mid_traps)}/>
              <!-- زیربغل (لت) -->
              <path d="M124 34 L128 46 L134 55 L125 57 Q120 46 124 34 Z" ${heatAttr(h.lats)}/>
              <path d="M146 34 L142 46 L136 55 L145 57 Q150 46 146 34 Z" ${heatAttr(h.lats)}/>
              <!-- فیله کمر -->
              <path d="M129 52 L134.2 52 L134.2 67 L128 67 Z" ${heatAttr(h.erector)}/>
              <path d="M141 52 L135.8 52 L135.8 67 L142 67 Z" ${heatAttr(h.erector)}/>
              <!-- پشت‌بازو -->
              <path d="M116 36 L121 37 L117 52 L111 51 Z" ${heatAttr(h.triceps)}/>
              <path d="M154 36 L149 37 L153 52 L159 51 Z" ${heatAttr(h.triceps)}/>
              <!-- پشت ساعد -->
              <path d="M111 52.5 L116.5 53 L111.5 70 L106.5 69 Z" ${heatAttr(h.forearm_back)}/>
              <path d="M159 52.5 L153.5 53 L158.5 70 L163.5 69 Z" ${heatAttr(h.forearm_back)}/>
              <!-- پشت مچ و دست -->
              <path d="M106 70.5 L111 71 L108.5 80.5 L103.5 79 Z" ${heatAttr(h.wrist_hand)}/>
              <path d="M164 70.5 L159 71 L161.5 80.5 L166.5 79 Z" ${heatAttr(h.wrist_hand)}/>
              <!-- باسن و کنار لگن -->
              <path d="M125 68 L134.5 68 L134.5 81 L124 80 Z" ${heatAttr(h.glutes)}/>
              <path d="M145 68 L135.5 68 L135.5 81 L146 80 Z" ${heatAttr(h.glutes)}/>
              <path d="M124 68 L121 76 L123 84 L125 80 Z" ${heatAttr(h.abductors)}/>
              <path d="M146 68 L149 76 L147 84 L145 80 Z" ${heatAttr(h.abductors)}/>
              <!-- پشت ران (چپ سمت چپ تصویر / راست سمت راست تصویر) -->
              <path d="M124.5 82 L133.5 82 L132.5 103 L125.5 103 Z" ${hamL}/>
              <path d="M145.5 82 L136.5 82 L137.5 103 L144.5 103 Z" ${hamR}/>
              <!-- ساق پشت -->
              <path d="M125 105 Q124 116 126.5 131 L130.5 131 Q133 116 131.5 105 Z" ${calL}/>
              <path d="M145 105 Q146 116 143.5 131 L139.5 131 Q137 116 138.5 105 Z" ${calR}/>
              <!-- پاشنه پشت -->
              <rect x="126" y="132" width="5" height="5" rx="1.5" fill="#171f30" stroke="#2c3850" stroke-width="0.5"/>
              <rect x="139" y="132" width="5" height="5" rx="1.5" fill="#171f30" stroke="#2c3850" stroke-width="0.5"/>
            </g>
          </svg>
          <div class="svg-2d-labels">
            <span>جلو</span>
            <span>پشت</span>
          </div>
        </div>
      `;
    }

    const COLUMN_DEFS = {
      idx: {
        label: '#',
        thStyle: 'width: 78px; text-align: center;',
        cellClass: 'col-idx',
        renderCell: (ex, isMoveDone) => {
          const supersetBadge = ex.superset
            ? `<span class="superset-pill">${ex.superset.pos === 'start' ? '⚡ سوپرست ۱/۲' : '🔗 سوپرست ۲/۲'}</span>${ex.superset.pos === 'start' ? '<span class="superset-arrow">⬇️ بدون استراحت</span>' : ''}`
            : '';
          return `
            <label class="idx-check-row" title="ثبت انجام شدن این حرکت">
              <input type="checkbox" class="move-checkbox" ${isMoveDone ? 'checked' : ''} onchange="toggleMoveCompleted('${ex.order}')">
              <span>${ex.order}</span>
            </label>
            ${supersetBadge}
          `;
        }
      },
      posture: {
        label: 'تکیه‌گاه و زاویه',
        thStyle: 'min-width: 118px;',
        cellClass: 'col-posture',
        renderCell: (ex) => {
          const angleHtml = ex.angle ? `<div><span class="angle-badge">📐 ${ex.angle}</span></div>` : '';
          return `<div>${ex.posture}</div>${angleHtml}`;
        }
      },
      equipment: {
        label: 'تجهیزات',
        thStyle: 'min-width: 120px;',
        cellClass: 'col-equip',
        renderCell: (ex) => ex.equipment
      },
      name_en: {
        label: 'English Name',
        thStyle: 'min-width: 165px; text-align: left; direction: ltr;',
        cellClass: 'col-name-en',
        renderCell: (ex) => ex.name_en
      },
      execution: {
        label: 'جزئیات نحوه انجام',
        thStyle: 'min-width: 225px;',
        cellClass: 'col-execution',
        renderCell: (ex) => ex.execution
      },
      tips: {
        label: 'مراقبت مفصل و نکات کلیدی',
        thStyle: 'min-width: 215px;',
        cellClass: 'col-tips',
        renderCell: (ex) => ex.tips
      },
      sets: {
        label: 'ست',
        thStyle: 'width: 62px; text-align: center;',
        cellClass: 'col-sets',
        renderCell: (ex) => ex.sets
      },
      reps: {
        label: 'تکرار',
        thStyle: 'width: 82px; text-align: center;',
        cellClass: 'col-reps',
        renderCell: (ex) => ex.reps
      },
      tempo: {
        label: 'تمپو',
        thStyle: 'width: 78px; text-align: center;',
        cellClass: 'col-tempo',
        renderCell: (ex) => ex.tempo
      },
      targets: {
        label: 'درصد عضلات درگیر',
        thStyle: 'min-width: 210px;',
        cellClass: 'col-targets',
        renderCell: (ex) => {
          const targetsHtml = (ex.targets || []).map(t => {
            let fa = t.fa;
            let en = t.en;
            if (!fa && t.name) {
              const m = t.name.match(/^([^()]+)\(([^()]+)\)$/);
              fa = m ? m[1].trim() : t.name;
              en = m ? m[2].trim() : '';
            }
            return `
              <div class="muscle-target-card">
                <div class="muscle-target-top">
                  <span class="muscle-fa">${fa}</span>
                  <span class="muscle-target-pct">${t.pct}</span>
                </div>
                ${en ? `<div class="muscle-en">${en}</div>` : ''}
              </div>
            `;
          }).join('');
          return `<div class="muscle-breakdown">${targetsHtml}</div>`;
        }
      },
      muscle_2d: {
        label: 'آناتومی 2D',
        thStyle: 'width: 145px; text-align: center;',
        cellClass: 'col-muscle-2d',
        renderCell: (ex) => renderMuscle2D(ex)
      },
      muscle: {
        label: 'عضله هدف',
        thStyle: 'min-width: 135px; text-align: center;',
        cellClass: 'col-muscle',
        renderCell: (ex) => `<span class="muscle-chip">${ex.muscle}</span>`
      }
    };

    function loadColumnOrder() {
      try {
        const saved = JSON.parse(localStorage.getItem('gym_column_order_v3') || 'null');
        if (Array.isArray(saved) && saved.length === DEFAULT_COLUMN_ORDER.length) {
          const valid = DEFAULT_COLUMN_ORDER.every(k => saved.includes(k));
          if (valid) return saved;
        }
      } catch (e) {}
      return [...DEFAULT_COLUMN_ORDER];
    }

    let columnOrder = loadColumnOrder();
    let dragSourceIndex = null;

    function saveColumnOrder() {
      localStorage.setItem('gym_column_order_v3', JSON.stringify(columnOrder));
      updateColumnOrderFooter();
    }

    function moveColumn(index, delta) {
      const targetIndex = index + delta;
      if (targetIndex < 0 || targetIndex >= columnOrder.length) return;
      const [moved] = columnOrder.splice(index, 1);
      columnOrder.splice(targetIndex, 0, moved);
      saveColumnOrder();
      renderTable();
    }

    function resetColumnOrder() {
      columnOrder = [...DEFAULT_COLUMN_ORDER];
      saveColumnOrder();
      renderTable();
    }

    function updateColumnOrderFooter() {
      const el = document.getElementById('colOrderSummary');
      if (!el) return;
      const labels = columnOrder.map((k, i) => `${i + 1}. ${COLUMN_DEFS[k].label}`).join(' ← ');
      el.innerText = `چیدمان ستون‌ها (از راست به چپ): ${labels}`;
    }

    function copyColumnOrder() {
      const text = columnOrder.map((k, i) => `${i + 1}. ${COLUMN_DEFS[k].label}`).join(' | ');
      const btn = document.getElementById('copyOrderBtn');
      const doneUI = () => {
        if (!btn) return;
        btn.classList.add('copied');
        btn.innerText = '✅ چیدمان کپی شد!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerText = '📋 کپی چیدمان برای ارسال';
        }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(doneUI).catch(() => {
          fallbackCopyText(text);
          doneUI();
        });
      } else {
        fallbackCopyText(text);
        doneUI();
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = '';

      const dayNames = {
        1: { name: "شنبه (روز ۱)", sub: "لت، سرشانه، بازو" },
        2: { name: "یکشنبه (روز ۲)", sub: "سینه، پشت‌بازو، پا" },
        3: { name: "دوشنبه (روز ۳)", sub: "لت، ساعد، پنجه، ساق" },
        4: { name: "چهارشنبه (روز ۴)", sub: "زیرسینه، شانه، پا" },
        5: { name: "پنجشنبه (روز ۵)", sub: "پشت، ساعد، شکم" }
      };

      for (let d = 1; d <= 5; d++) {
        // کارت روز تمرین همراه با چک‌باکس مستقیم انجام شدن روز
        const card = document.createElement('div');
        const isActive = (d === currentDay) ? 'active' : '';
        const isDone = completedDays[d] ? 'completed' : '';
        card.className = `tab-card ${isActive} ${isDone}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.onclick = () => switchDay(d);
        card.innerHTML = `
          <div class="tab-card-top">
            <span class="tab-card-title">${dayNames[d].name}</span>
            <label class="day-check-wrap" title="تیک انجام شدن این روز" onclick="event.stopPropagation()">
              <input type="checkbox" class="day-checkbox" ${completedDays[d] ? 'checked' : ''} onchange="toggleDayCompleted(${d})">
            </label>
          </div>
          <span class="day-tag">${dayNames[d].sub}</span>
        `;
        container.appendChild(card);

        // اگر بعد از این روز استراحت ثبت شده، کارت استراحت نشان بده؛ وگرنه دکمه + بگذار
        if (restAfterDay[d]) {
          const restSlot = document.createElement('div');
          restSlot.className = 'rest-slot';
          restSlot.title = 'کلیک برای برداشتن روز استراحت';
          restSlot.onclick = () => toggleRestAfterDay(d);
          restSlot.innerHTML = `<span>🛌 استراحت</span><span class="rest-remove-hint">حذف (×)</span>`;
          container.appendChild(restSlot);
        } else {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'add-rest-btn';
          addBtn.title = `افزودن روز استراحت بعد از ${dayNames[d].name}`;
          addBtn.innerText = '+';
          addBtn.onclick = () => toggleRestAfterDay(d);
          container.appendChild(addBtn);
        }
      }
    }

    function switchDay(day) {
      currentDay = day;
      renderDayTabs();

      const dayData = programData[day];
      const supersetCount = dayData.exercises.filter(e => e.superset && e.superset.pos === 'start').length;
      const legend = document.getElementById('supersetLegend');
      if (legend) {
        if (supersetCount > 0) {
          legend.classList.add('visible');
        } else {
          legend.classList.remove('visible');
        }
      }

      renderTable();
    }

    function renderTableHeader() {
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '';
      const tr = document.createElement('tr');

      columnOrder.forEach((colKey, idx) => {
        const def = COLUMN_DEFS[colKey];
        const th = document.createElement('th');
        th.setAttribute('style', def.thStyle);
        th.draggable = true;

        th.ondragstart = (e) => {
          dragSourceIndex = idx;
          th.classList.add('dragging');
          if (e.dataTransfer) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(idx));
          }
        };
        th.ondragover = (e) => {
          e.preventDefault();
          if (dragSourceIndex !== null && dragSourceIndex !== idx) {
            th.classList.add('drag-over');
          }
        };
        th.ondragleave = () => {
          th.classList.remove('drag-over');
        };
        th.ondrop = (e) => {
          e.preventDefault();
          th.classList.remove('drag-over');
          if (dragSourceIndex !== null && dragSourceIndex !== idx) {
            const [moved] = columnOrder.splice(dragSourceIndex, 1);
            columnOrder.splice(idx, 0, moved);
            dragSourceIndex = null;
            saveColumnOrder();
            renderTable();
          }
        };
        th.ondragend = () => {
          dragSourceIndex = null;
          th.classList.remove('dragging');
        };

        const resetMovesHtml = colKey === 'idx'
          ? `<button type="button" class="th-reset-btn" title="پاک کردن تیک حرکات امروز" onclick="event.stopPropagation(); resetCurrentDayMoves()">↺</button>`
          : '';

        th.innerHTML = `
          <div class="th-inner">
            <div class="th-title-row">
              <span>${def.label}</span>
              ${resetMovesHtml}
            </div>
            <div class="th-controls" onclick="event.stopPropagation()">
              <button type="button" class="th-move-btn" title="انتقال به راست" ${idx === 0 ? 'disabled' : ''} onclick="moveColumn(${idx}, -1)">→</button>
              <span class="th-drag-grip" title="برای جابه‌جایی بکشید و رها کنید">⋮⋮</span>
              <button type="button" class="th-move-btn" title="انتقال به چپ" ${idx === columnOrder.length - 1 ? 'disabled' : ''} onclick="moveColumn(${idx}, 1)">←</button>
            </div>
          </div>
        `;
        tr.appendChild(th);
      });

      thead.appendChild(tr);
    }

    function renderTable() {
      renderTableHeader();
      updateColumnOrderFooter();

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const dayData = programData[currentDay];
      const dayMoves = completedMoves[currentDay] || {};

      dayData.exercises.forEach(ex => {
        const isMoveDone = !!dayMoves[ex.order];
        const tr = document.createElement('tr');
        const classes = [];
        if (ex.superset) {
          classes.push(`superset-row superset-${ex.superset.pos}`);
        }
        if (isMoveDone) {
          classes.push('move-done');
        }
        tr.className = classes.join(' ');

        tr.innerHTML = columnOrder.map(colKey => {
          const def = COLUMN_DEFS[colKey];
          return `<td class="${def.cellClass}">${def.renderCell(ex, isMoveDone)}</td>`;
        }).join('');

        tbody.appendChild(tr);
      });
    }

    function toggleDayCompleted(day = currentDay) {
      completedDays[day] = !completedDays[day];
      localStorage.setItem('gym_completed_days', JSON.stringify(completedDays));
      renderDayTabs();
    }

    function toggleMoveCompleted(order) {
      if (!completedMoves[currentDay]) {
        completedMoves[currentDay] = {};
      }
      completedMoves[currentDay][order] = !completedMoves[currentDay][order];
      localStorage.setItem('gym_completed_moves', JSON.stringify(completedMoves));
      renderTable();
    }

    function resetCurrentDayMoves() {
      completedMoves[currentDay] = {};
      localStorage.setItem('gym_completed_moves', JSON.stringify(completedMoves));
      renderTable();
    }

    function toggleRestAfterDay(day) {
      restAfterDay[day] = !restAfterDay[day];
      localStorage.setItem('gym_rest_after_day_v2', JSON.stringify(restAfterDay));
      renderDayTabs();
    }

    // راه‌اندازی اولیه
    renderDayTabs();
    switchDay(3);
  </script>
</body>
