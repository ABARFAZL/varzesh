<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه تمرینی اختصاصی و سیستم مدیریت جلسات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: #111622;
      --card-border: #1e2638;
      --accent-orange: #ff5e36;
      --accent-cyan: #00f2fe;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --surface: #182030;
      --table-header: #151c2c;
      --table-row-alt: #0d121c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      padding: 12px;
    }

    main {
      max-width: 1450px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* تب‌های روزهای تمرینی، چک‌باکس روز و دکمه + استراحت */
    .day-tabs {
      display: flex;
      align-items: stretch;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding: 4px 2px 6px 2px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-card {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      min-width: 148px;
      flex: 1;
      position: relative;
      user-select: none;
    }

    .tab-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .tab-card-title {
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .day-check-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-checkbox {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin: 0;
    }

    .tab-card span.day-tag {
      font-size: 0.68rem;
      opacity: 0.85;
      font-weight: 500;
      white-space: nowrap;
      text-align: right;
    }

    .tab-card:hover {
      border-color: rgba(255, 94, 54, 0.5);
      color: var(--text-main);
    }

    .tab-card.active {
      background: linear-gradient(135deg, rgba(255, 94, 54, 0.25) 0%, rgba(255, 94, 54, 0.08) 100%);
      border-color: var(--accent-orange);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 94, 54, 0.2);
    }

    .tab-card.active span.day-tag {
      color: var(--accent-orange);
    }

    .tab-card.completed {
      border-color: rgba(16, 185, 129, 0.55);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14) 0%, var(--surface) 100%);
    }

    .tab-card.completed.active {
      background: linear-gradient(135deg, rgba(255, 94, 54, 0.22) 0%, rgba(16, 185, 129, 0.14) 100%);
      border-color: var(--accent-orange);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .tab-card.completed .tab-card-title {
      color: #6ee7b7;
    }

    /* دکمه + افزودن روز استراحت کنار هر روز */
    .add-rest-btn {
      background: rgba(168, 85, 247, 0.08);
      border: 1px dashed rgba(168, 85, 247, 0.35);
      color: #c084fc;
      border-radius: 10px;
      width: 28px;
      min-width: 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
    }

    .add-rest-btn:hover {
      background: rgba(168, 85, 247, 0.24);
      border-color: var(--accent-purple);
      color: #fff;
      transform: scale(1.05);
    }

    .rest-slot {
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #e9d5ff;
      border-radius: 12px;
      min-width: 96px;
      padding: 8px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      position: relative;
    }

    .rest-slot:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(248, 113, 113, 0.6);
      color: #fecaca;
    }

    .rest-remove-hint {
      font-size: 0.6rem;
      opacity: 0.75;
    }

    /* نوار کنترل وضعیت جلسه روز جاری */
    .day-status-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .day-info-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-info-text h2 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }

    .badge-count {
      background: rgba(255, 94, 54, 0.15);
      border: 1px solid rgba(255, 94, 54, 0.3);
      color: var(--accent-orange);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .session-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .session-toggle-btn:hover {
      border-color: var(--accent-green);
      color: #fff;
    }

    .session-toggle-btn.done {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-green);
      color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    /* جدول ستونی تفکیک‌شده حرکات */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    .superset-legend {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #e9d5ff;
      border-radius: 10px;
      padding: 8px 14px;
      margin-bottom: 10px;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .superset-legend.visible {
      display: flex;
    }

    table.workout-table {
      width: 100%;
      min-width: 1260px;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.78rem;
    }

    table.workout-table th {
      background: var(--table-header);
      color: #e2e8f0;
      font-weight: 800;
      padding: 11px 9px;
      border-bottom: 2px solid var(--card-border);
      border-left: 1px solid var(--card-border);
      white-space: nowrap;
      font-size: 0.73rem;
    }

    table.workout-table th:last-child {
      border-left: none;
    }

    table.workout-table td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--card-border);
      border-left: 1px solid var(--card-border);
      vertical-align: middle;
      color: #cbd5e1;
      line-height: 1.55;
    }

    table.workout-table td:last-child {
      border-left: none;
    }

    table.workout-table tr:nth-child(even):not(.superset-row) td {
      background-color: var(--table-row-alt);
    }

    table.workout-table tr:hover:not(.superset-row) td {
      background-color: rgba(255, 94, 54, 0.04);
    }

    /* ردیف‌های سوپرست با اتصال بصری واضح */
    table.workout-table tr.superset-row td {
      background-color: rgba(168, 85, 247, 0.07) !important;
    }

    table.workout-table tr.superset-row:hover td {
      background-color: rgba(168, 85, 247, 0.13) !important;
    }

    table.workout-table tr.superset-start td {
      border-top: 2px solid rgba(168, 85, 247, 0.55);
      border-bottom: 1px dashed rgba(168, 85, 247, 0.45);
    }

    table.workout-table tr.superset-end td {
      border-bottom: 2px solid rgba(168, 85, 247, 0.55);
    }

    table.workout-table tr.superset-row td.col-idx {
      border-right: 4px solid var(--accent-purple);
      background: rgba(168, 85, 247, 0.14) !important;
      color: #e9d5ff;
    }

    table.workout-table tr.move-done td {
      background-color: rgba(16, 185, 129, 0.08) !important;
    }

    table.workout-table tr.move-done:not(.superset-row) td.col-idx {
      border-right: 3px solid var(--accent-green);
      background: rgba(16, 185, 129, 0.14) !important;
      color: #6ee7b7;
    }

    table.workout-table tr.move-done .col-execution,
    table.workout-table tr.move-done .col-name-en {
      opacity: 0.72;
    }

    .superset-pill {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 5px;
      border-radius: 5px;
      font-size: 0.61rem;
      font-weight: 800;
      line-height: 1.25;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #f3e8ff;
      white-space: nowrap;
    }

    .superset-arrow {
      display: block;
      font-size: 0.62rem;
      color: #c084fc;
      margin-top: 3px;
      font-weight: 700;
    }

    /* ستون‌های مجزا و تخصصی */
    .col-idx {
      width: 78px;
      text-align: center !important;
      font-weight: 800;
      color: var(--accent-orange);
      background: rgba(255, 94, 54, 0.05);
    }

    .idx-check-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .move-checkbox {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
    }

    .reset-moves-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-moves-btn:hover {
      border-color: var(--accent-orange);
      color: #fff;
    }

    .status-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .col-muscle {
      min-width: 195px;
      vertical-align: top !important;
    }

    .muscle-chip {
      display: inline-block;
      font-weight: 800;
      font-size: 0.77rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 94, 54, 0.14);
      border: 1px solid rgba(255, 94, 54, 0.3);
      color: #ff9f7f;
      margin-bottom: 6px;
    }

    .muscle-breakdown {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
      padding-top: 5px;
      border-top: 1px dashed rgba(148, 163, 184, 0.2);
    }

    .muscle-target-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 0.69rem;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .muscle-target-pct {
      font-weight: 800;
      font-size: 0.68rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0 5px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .col-name-en {
      min-width: 165px;
      direction: ltr;
      text-align: left !important;
      font-weight: 700;
      font-size: 0.74rem;
      color: var(--accent-cyan);
      letter-spacing: 0.1px;
    }

    .col-posture {
      min-width: 155px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 0.74rem;
    }

    .angle-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 0.67rem;
      font-weight: 700;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fcd34d;
    }

    .col-equip {
      min-width: 120px;
      color: #cbd5e1;
      font-size: 0.74rem;
      font-weight: 600;
    }

    .col-execution {
      min-width: 225px;
      font-weight: 500;
      color: #f8fafc;
      font-size: 0.74rem;
    }

    .col-sets {
      width: 62px;
      text-align: center !important;
      font-weight: 900;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
      white-space: nowrap;
      font-size: 0.8rem;
    }

    .col-reps {
      width: 82px;
      text-align: center !important;
      font-weight: 900;
      color: #34d399;
      background: rgba(16, 185, 129, 0.05);
      white-space: nowrap;
      font-size: 0.77rem;
    }

    .col-tempo {
      width: 78px;
      text-align: center !important;
      direction: ltr;
      font-family: monospace, sans-serif;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .col-tips {
      min-width: 215px;
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .col-tips strong {
      color: #fbbf24;
    }

    @media (max-width: 768px) {
      .day-tabs {
        padding-bottom: 6px;
      }
      .tab-card {
        min-width: 132px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>

  <main>
    <!-- تب‌های روزها همراه با چک‌باکس روز و دکمه + استراحت -->
    <div class="day-tabs" id="dayTabsContainer">
      <!-- توسط جاوااسکریپت پر می‌شود -->
    </div>

    <!-- نوار وضعیت و تأیید جلسه جاری -->
    <div class="day-status-bar">
      <div class="day-info-text">
        <h2 id="dayBarTitle">روز جاری</h2>
        <span class="badge-count" id="dayMoveCount">۸ حرکت</span>
      </div>
      <div class="status-actions">
        <button class="reset-moves-btn" onclick="resetCurrentDayMoves()" title="پاک کردن تیک حرکات همین روز برای هفته جدید">↺ پاک کردن تیک‌های امروز</button>
        <button class="session-toggle-btn" id="dayDoneBtn" onclick="toggleDayCompleted(currentDay)">
          <span id="dayDoneIcon">⚪</span>
          <span id="dayDoneText">ثبت پایان جلسه</span>
        </button>
      </div>
    </div>

    <!-- راهنمای سوپرست (فقط در روزهای دارای سوپرست نمایش داده می‌شود) -->
    <div class="superset-legend" id="supersetLegend">
      <span>⚡ ردیف‌های بنفش متصل به هم «سوپرست» هستند: حرکت اول را که زدی، بدون استراحت بلافاصله حرکت دوم را انجام بده و بعد استراحت کن.</span>
    </div>

    <!-- جدول ستونی مجزا و تفکیک‌شده -->
    <div class="table-container">
      <table class="workout-table">
        <thead>
          <tr>
            <th style="width: 78px; text-align: center;">#</th>
            <th style="min-width: 195px;">عضله هدف و درصد درگیری</th>
            <th style="min-width: 165px; text-align: left; direction: ltr;">English Name</th>
            <th style="min-width: 155px;">تکیه‌گاه و زاویه</th>
            <th style="min-width: 120px;">تجهیزات</th>
            <th style="min-width: 225px;">جزئیات نحوه انجام</th>
            <th style="width: 62px; text-align: center;">ست</th>
            <th style="width: 82px; text-align: center;">تکرار</th>
            <th style="width: 78px; text-align: center;">تمپو</th>
            <th style="min-width: 215px;">مراقبت مفصل و نکات کلیدی</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- توسط جاوااسکریپت پر می‌شود -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // اطلاعات ۵ روز برنامه با ستون‌های تفکیک‌شده دقیق، درصد عضلات و سوپرست‌های مجزا

            sets: "۴ ست",
            reps: "۱۲ تکرار",

            tips: "کمر هنگام برگشت خم نشود و هنگام کشش تاب نخورد؛ پای چپ بدون فشار محوری روی زمین یا تکیه‌گاه آزاد بماند."
          },
          {
            order: "۳",
            muscle: "سرشانه جلویی و میانی",
            targets: [
              { name: "دلتوئید جلویی (Anterior Deltoid)", pct: "۵۵٪" },

    let currentDay = 3; // پیش‌فرض روی روز سوم (دوشنبه)

    let completedMoves = JSON.parse(localStorage.getItem('gym_completed_moves') || '{}');

    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = '';

      const dayNames = {
        1: { name: "شنبه (روز ۱)", sub: "لت، سرشانه، بازو" },
        2: { name: "یکشنبه (روز ۲)", sub: "سینه، پشت‌بازو، پا" },
        3: { name: "دوشنبه (روز ۳)", sub: "لت، ساعد، پنجه، ساق" },
        4: { name: "چهارشنبه (روز ۴)", sub: "زیرسینه، شانه، پا" },
        5: { name: "پنجشنبه (روز ۵)", sub: "پشت، ساعد، شکم" }
      };

      for (let d = 1; d <= 5; d++) {
        // کارت روز تمرین همراه با چک‌باکس مستقیم انجام شدن روز
        const card = document.createElement('div');
        const isActive = (d === currentDay) ? 'active' : '';
        const isDone = completedDays[d] ? 'completed' : '';
        card.className = `tab-card ${isActive} ${isDone}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.onclick = () => switchDay(d);
        card.innerHTML = `
          <div class="tab-card-top">
            <span class="tab-card-title">${dayNames[d].name}</span>
            <label class="day-check-wrap" title="تیک انجام شدن این روز" onclick="event.stopPropagation()">
              <input type="checkbox" class="day-checkbox" ${completedDays[d] ? 'checked' : ''} onchange="toggleDayCompleted(${d})">
            </label>
          </div>
          <span class="day-tag">${dayNames[d].sub}</span>
        `;
        container.appendChild(card);

        // اگر بعد از این روز استراحت ثبت شده، کارت استراحت نشان بده؛ وگرنه دکمه + بگذار
        if (restAfterDay[d]) {
          const restSlot = document.createElement('div');
          restSlot.className = 'rest-slot';
          restSlot.title = 'کلیک برای برداشتن روز استراحت';
          restSlot.onclick = () => toggleRestAfterDay(d);
          restSlot.innerHTML = `<span>🛌 استراحت</span><span class="rest-remove-hint">حذف (×)</span>`;
          container.appendChild(restSlot);
        } else {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'add-rest-btn';
          addBtn.title = `افزودن روز استراحت بعد از ${dayNames[d].name}`;
          addBtn.innerText = '+';
          addBtn.onclick = () => toggleRestAfterDay(d);
          container.appendChild(addBtn);
        }
      }
    }

    function updateDayMoveCountBadge() {
      const dayData = programData[currentDay];
      const dayMoves = completedMoves[currentDay] || {};
      const doneCount = dayData.exercises.filter(e => dayMoves[e.order]).length;
      const supersetCount = dayData.exercises.filter(e => e.superset && e.superset.pos === 'start').length;

      let parts = [`${dayData.exercises.length} حرکت`];
      if (doneCount > 0) {
        parts.push(`${doneCount} انجام‌شده`);
      }
      if (supersetCount > 0) {
        parts.push(`${supersetCount} سوپرست`);
      }
      document.getElementById('dayMoveCount').innerText = parts.join(' • ');
    }

    function switchDay(day) {
      currentDay = day;
      renderDayTabs();

      const dayData = programData[day];
      document.getElementById('dayBarTitle').innerText = dayData.title;
      updateDayMoveCountBadge();

      const supersetCount = dayData.exercises.filter(e => e.superset && e.superset.pos === 'start').length;
      const legend = document.getElementById('supersetLegend');
      if (legend) {
        if (supersetCount > 0) {
          legend.classList.add('visible');
        } else {
          legend.classList.remove('visible');
        }
      }

      updateDayDoneButtonUI();
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const dayData = programData[currentDay];
      const dayMoves = completedMoves[currentDay] || {};

      dayData.exercises.forEach(ex => {
        const isMoveDone = !!dayMoves[ex.order];
        const tr = document.createElement('tr');
        const classes = [];
        if (ex.superset) {
          classes.push(`superset-row superset-${ex.superset.pos}`);
        }
        if (isMoveDone) {
          classes.push('move-done');
        }
        tr.className = classes.join(' ');

        const supersetBadge = ex.superset
          ? `<span class="superset-pill">${ex.superset.pos === 'start' ? '⚡ سوپرست ۱/۲' : '🔗 سوپرست ۲/۲'}</span>${ex.superset.pos === 'start' ? '<span class="superset-arrow">⬇️ بدون استراحت</span>' : ''}`
          : '';

        const targetsHtml = (ex.targets || []).map(t => `
          <div class="muscle-target-item">
            <span>• ${t.name}</span>
            <span class="muscle-target-pct">${t.pct}</span>
          </div>
        `).join('');

        const angleHtml = ex.angle
          ? `<div><span class="angle-badge">📐 ${ex.angle}</span></div>`
          : '';

        tr.innerHTML = `
          <td class="col-idx">
            <label class="idx-check-row" title="ثبت انجام شدن این حرکت">
              <input type="checkbox" class="move-checkbox" ${isMoveDone ? 'checked' : ''} onchange="toggleMoveCompleted('${ex.order}')">
              <span>${ex.order}</span>
            </label>
            ${supersetBadge}
          </td>
          <td class="col-muscle">
            <span class="muscle-chip">${ex.muscle}</span>
            <div class="muscle-breakdown">${targetsHtml}</div>
          </td>
          <td class="col-name-en">${ex.name_en}</td>
          <td class="col-posture">
            <div>${ex.posture}</div>
            ${angleHtml}
          </td>
          <td class="col-equip">${ex.equipment}</td>
          <td class="col-execution">${ex.execution}</td>
          <td class="col-sets">${ex.sets}</td>
          <td class="col-reps">${ex.reps}</td>
          <td class="col-tempo">${ex.tempo}</td>
          <td class="col-tips">${ex.tips}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function toggleDayCompleted(day = currentDay) {
      completedDays[day] = !completedDays[day];
      localStorage.setItem('gym_completed_days', JSON.stringify(completedDays));
      renderDayTabs();
      if (day === currentDay) {
        updateDayDoneButtonUI();
      }
    }

    function toggleMoveCompleted(order) {
      if (!completedMoves[currentDay]) {
        completedMoves[currentDay] = {};
      }
      completedMoves[currentDay][order] = !completedMoves[currentDay][order];
      localStorage.setItem('gym_completed_moves', JSON.stringify(completedMoves));
      updateDayMoveCountBadge();
      renderTable();
    }

    function resetCurrentDayMoves() {
      completedMoves[currentDay] = {};
      localStorage.setItem('gym_completed_moves', JSON.stringify(completedMoves));
      updateDayMoveCountBadge();
      renderTable();
    }

    function updateDayDoneButtonUI() {
      const btn = document.getElementById('dayDoneBtn');
      const icon = document.getElementById('dayDoneIcon');
      const text = document.getElementById('dayDoneText');

      if (completedDays[currentDay]) {
        btn.classList.add('done');
        icon.innerText = '✅';
        text.innerText = 'جلسه امروز تکمیل و ثبت شد';
      } else {
        btn.classList.remove('done');
        icon.innerText = '⚪';
        text.innerText = 'ثبت پایان جلسه (کلیک برای تایید)';
      }
    }

    function toggleRestAfterDay(day) {
      restAfterDay[day] = !restAfterDay[day];
      localStorage.setItem('gym_rest_after_day_v2', JSON.stringify(restAfterDay));
      renderDayTabs();
    }

    // راه‌اندازی اولیه
    renderDayTabs();
    switchDay(3);
  </script>
</body>
</html>
