<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_women-skirt-nike-court" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e2e8f0" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="skirtGrad_women-skirt-nike-court" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="325" rx="85" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_women-skirt-nike-court)"/>
  <g filter="url(#shadow_women-skirt-nike-court)">
    <!-- کمر کش پهن -->
    <rect x="100" y="70" width="100" height="24" rx="4" fill="#e2e8f0"/>
    <text x="150" y="86" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Nike</text>
    <!-- دامن کلوش با پلیسه‌ها -->
    <path d="M100,94 L60,250 Q150,270 240,250 L200,94 Z" fill="url(#skirtGrad_women-skirt-nike-court)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- خطوط پلیسه -->
    <line x1="110" y1="94" x2="80" y2="252" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="130" y1="94" x2="115" y2="257" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="150" y1="94" x2="150" y2="260" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="170" y1="94" x2="185" y2="257" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="190" y1="94" x2="220" y2="252" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- مشخصات -->
    <text x="150" y="295" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">VICTORY TENNIS SKIRT</text>
    <text x="150" y="315" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle" font-family="sans-serif">DRI-FIT PLEATED</text>
  </g>
