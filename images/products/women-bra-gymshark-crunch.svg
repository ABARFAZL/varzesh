<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_women-bra-gymshark-crunch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="braGrad_women-bra-gymshark-crunch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="315" rx="75" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_women-bra-gymshark-crunch)"/>
  <g filter="url(#shadow_women-bra-gymshark-crunch)">
    <!-- بندهای شانه و بدنه نیم تنه -->
    <path d="M105,70 Q150,110 195,70 L215,100 L210,165 Q150,195 90,165 L85,100 Z" fill="url(#braGrad_women-bra-gymshark-crunch)" stroke="#818cf8" stroke-width="1.5"/>
    <!-- کش پهن زیر سینه -->
    <path d="M90,165 Q150,195 210,165 L210,205 Q150,235 90,205 Z" fill="#818cf8"/>
    <text x="150" y="193" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Gymshark</text>
    <!-- پد و کاپ -->
    <circle cx="120" cy="135" r="18" fill="rgba(255,255,255,0.08)"/>
    <circle cx="180" cy="135" r="18" fill="rgba(255,255,255,0.08)"/>
    <text x="150" y="245" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">CROSS-BACK SPORTS BRA</text>
    <text x="150" y="265" font-size="10" font-weight="700" fill="#818cf8" text-anchor="middle" font-family="sans-serif">MAX VENTILATION</text>
  </g>
