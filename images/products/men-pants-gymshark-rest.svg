<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_men-pants-gymshark-rest" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="pantsGrad_men-pants-gymshark-rest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="75" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_men-pants-gymshark-rest)"/>
  <g filter="url(#shadow_men-pants-gymshark-rest)">
    <!-- کمر گنی / کشی -->
    <rect x="95" y="60" width="110" height="26" rx="5" fill="#38bdf8"/>
    <text x="150" y="78" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Gymshark</text>
    <!-- دو پاچه شلوار / شلوارک -->
    <path d="M95,86 L75,310 L120,310 L150,150 L180,310 L225,310 L205,86 Z" fill="url(#pantsGrad_men-pants-gymshark-rest)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- نوار شبرنگ بغل پاچه -->
    <line x1="85" y1="100" x2="77" y2="300" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="215" y1="100" x2="223" y2="300" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,4"/>
    <!-- مشخصات متن -->
    <text x="150" y="332" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">REST DAY SWEATPANTS</text>
    <text x="150" y="348" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">GYM TO STREET</text>
  </g>
</svg>