<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_men-pants-nike-tech" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f8fafc" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="pantsGrad_men-pants-nike-tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="75" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_men-pants-nike-tech)"/>
  <g filter="url(#shadow_men-pants-nike-tech)">
    <!-- کمر گنی / کشی -->
    <rect x="95" y="60" width="110" height="26" rx="5" fill="#f8fafc"/>
    <text x="150" y="78" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Nike</text>
    <!-- دو پاچه شلوار / شلوارک -->
    <path d="M95,86 L75,310 L120,310 L150,150 L180,310 L225,310 L205,86 Z" fill="url(#pantsGrad_men-pants-nike-tech)" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- نوار شبرنگ بغل پاچه -->
    <line x1="85" y1="100" x2="77" y2="300" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="215" y1="100" x2="223" y2="300" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8,4"/>
    <!-- مشخصات متن -->
    <text x="150" y="332" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">TECH FLEECE JOGGER</text>
    <text x="150" y="348" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle" font-family="sans-serif">WARMTH & COMFORT</text>
  </g>
</svg>