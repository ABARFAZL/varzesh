<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_women-tee-lulu-swiftly" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2dd4bf" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="clothGrad_women-tee-lulu-swiftly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="80" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_women-tee-lulu-swiftly)"/>
  <g filter="url(#shadow_women-tee-lulu-swiftly)">
    <!-- یقه و آستین / رکابی -->
    
    <path d="M100,55 Q150,85 200,55 L260,95 L235,140 L210,125 L210,310 L90,310 L90,125 L65,140 L40,95 Z" fill="url(#clothGrad_{pid})" stroke="#2dd4bf" stroke-width="1.5"/>
    
    <!-- بافت دوخت و خطوط تنفسی -->
    <path d="M120,60 Q150,85 180,60" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="90" y1="300" x2="210" y2="300" stroke="#2dd4bf" stroke-width="3"/>
    <!-- لوگو و طرح گرافیکی رو سینه -->
    <circle cx="150" cy="150" r="36" fill="rgba(0,0,0,0.5)" stroke="#2dd4bf" stroke-width="2"/>
    <text x="150" y="148" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Lululemon</text>
    <text x="150" y="165" font-size="10" font-weight="800" fill="#2dd4bf" text-anchor="middle" font-family="sans-serif">SILVERESCENT ANTI-ODOR</text>
    <rect x="105" y="215" width="90" height="22" rx="4" fill="rgba(0,0,0,0.6)" stroke="#2dd4bf" stroke-width="1"/>
    <text x="150" y="230" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">CHAFE-FREE SEAMS</text>
