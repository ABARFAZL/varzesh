<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_gear-belt-sbd-lever" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="leatherGrad_gear-belt-sbd-lever" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="325" rx="85" ry="16" fill="#000000" opacity="0.6" filter="url(#shadow_gear-belt-sbd-lever)"/>
  <g filter="url(#shadow_gear-belt-sbd-lever)">
    <!-- حلقه چرم ضخیم کمربند -->
    <ellipse cx="150" cy="180" rx="100" ry="60" fill="none" stroke="url(#leatherGrad_gear-belt-sbd-lever)" stroke-width="48"/>
    <ellipse cx="150" cy="180" rx="100" ry="60" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- سگک فلزی استیل در جلو -->
    <rect x="125" y="150" width="50" height="60" rx="6" fill="#94a3b8" stroke="#ffffff" stroke-width="3"/>
    <rect x="135" y="160" width="30" height="40" rx="3" fill="#0f172a"/>
    <rect x="146" y="150" width="8" height="60" fill="#cbd5e1"/>
    <!-- لوگو و برند -->
    <rect x="100" y="260" width="100" height="26" rx="4" fill="rgba(0,0,0,0.7)" stroke="#ef4444" stroke-width="1"/>
    <text x="150" y="278" font-size="13" font-weight="900" fill="#ef4444" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">SBD Apparel</text>
    <text x="150" y="305" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">13MM LEVER POWER BELT</text>
  </g>
</svg>