<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_pnc-omega3-1000" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad_pnc-omega3-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="capGrad_pnc-omega3-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="labelGrad_pnc-omega3-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="85" ry="16" fill="#000000" opacity="0.6" filter="url(#shadow_pnc-omega3-1000)"/>
  <g filter="url(#shadow_pnc-omega3-1000)">
    <!-- درپوش -->
    <rect x="75" y="55" width="150" height="32" rx="6" fill="url(#capGrad_pnc-omega3-1000)"/>
    <ellipse cx="150" cy="55" rx="75" ry="12" fill="url(#capGrad_pnc-omega3-1000)"/>
    <ellipse cx="150" cy="87" rx="75" ry="8" fill="#000000" opacity="0.4"/>
    <!-- بدنه -->
    <rect x="60" y="95" width="180" height="230" rx="16" fill="url(#bodyGrad_pnc-omega3-1000)"/>
    <!-- لیبل -->
    <rect x="70" y="125" width="160" height="175" rx="10" fill="url(#labelGrad_pnc-omega3-1000)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="70" y="125" width="160" height="10" fill="#38bdf8"/>
    <!-- متن‌ها -->
    <text x="150" y="160" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">KAREN (PNC)</text>
    <line x1="90" y1="170" x2="210" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="150" y="205" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">OMEGA 3 FISH OIL</text>
    <text x="150" y="230" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">EPA 180 / DHA 120</text>
    <rect x="95" y="250" width="110" height="24" rx="4" fill="#38bdf8" opacity="0.9"/>
    <text x="150" y="266" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" font-family="sans-serif">100 SOFTGELS</text>
  </g>
