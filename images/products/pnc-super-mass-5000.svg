<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_pnc-super-mass-5000" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad_pnc-super-mass-5000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="38%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="capGrad_pnc-super-mass-5000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="85%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="labelGrad_pnc-super-mass-5000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="highlight_pnc-super-mass-5000" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- سایه بیضی کف محصول -->
  <ellipse cx="150" cy="335" rx="90" ry="16" fill="#000000" opacity="0.6" filter="url(#shadow_pnc-super-mass-5000)"/>

  <!-- سطل بزرگ مس ۵ کیلویی -->
  <g filter="url(#shadow_pnc-super-mass-5000)">
    <!-- دسته سطل -->
    <path d="M50,110 C50,25 250,25 250,110" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="110" r="8" fill="#334155"/>
    <circle cx="250" cy="110" r="8" fill="#334155"/>
    <!-- درپوش لبه‌دار سطل -->
    <ellipse cx="150" cy="85" rx="100" ry="22" fill="url(#capGrad_pnc-super-mass-5000)"/>
    <rect x="50" y="85" width="200" height="26" fill="url(#capGrad_pnc-super-mass-5000)"/>
    <ellipse cx="150" cy="111" rx="100" ry="18" fill="url(#capGrad_pnc-super-mass-5000)" stroke="#000000" stroke-width="1"/>
    <!-- بدنه مخروطی سطل -->
    <path d="M52,110 L68,325 Q150,345 232,325 L248,110 Z" fill="url(#bodyGrad_pnc-super-mass-5000)"/>
    <!-- هایلایت روی بدنه -->
    <path d="M68,115 L78,320 Q110,330 130,328 L115,115 Z" fill="url(#highlight_pnc-super-mass-5000)"/>
    <!-- لیبل بزرگ سطل -->
    <path d="M60,135 L70,305 Q150,325 230,305 L240,135 Z" fill="url(#labelGrad_pnc-super-mass-5000)" stroke="#dc2626" stroke-width="2"/>
    <rect x="63" y="140" width="174" height="15" fill="#dc2626"/>
    <!-- محتوای لیبل -->
    <text x="150" y="180" font-size="18" font-weight="900" fill="#dc2626" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="2">KAREN (PNC)</text>
    <line x1="85" y1="192" x2="215" y2="192" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <text x="150" y="224" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Arial Black, Impact, sans-serif">SUPER MASS GAINER</text>
    <text x="150" y="248" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle" font-family="sans-serif">HIGH CALORIE WEIGHT GAIN</text>
    <rect x="85" y="262" width="130" height="26" rx="5" fill="#dc2626"/>
    <text x="150" y="280" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="sans-serif">5000 GRAM BUCKET</text>
    <text x="150" y="302" font-size="11" font-weight="800" fill="#cbd5e1" text-anchor="middle" font-family="sans-serif">COMPLEX CARB & PROTEIN</text>
  </g>
</svg>