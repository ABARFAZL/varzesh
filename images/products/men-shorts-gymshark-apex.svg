<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_men-shorts-gymshark-apex" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="pantsGrad_men-shorts-gymshark-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="75" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_men-shorts-gymshark-apex)"/>
  <g filter="url(#shadow_men-shorts-gymshark-apex)">
    <!-- کمر گنی / کشی -->
    <rect x="95" y="60" width="110" height="26" rx="5" fill="#22c55e"/>
    <text x="150" y="78" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Gymshark</text>
    <!-- دو پاچه شلوار / شلوارک -->
    <path d="M95,86 L75,220 L120,220 L150,150 L180,220 L225,220 L205,86 Z" fill="url(#pantsGrad_men-shorts-gymshark-apex)" stroke="#22c55e" stroke-width="1.5"/>
