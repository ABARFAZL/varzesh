    <line x1="85" y1="100" x2="77" y2="210" stroke="#22c55e" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="215" y1="100" x2="223" y2="210" stroke="#22c55e" stroke-width="3" stroke-dasharray="8,4"/>
    <!-- مشخصات متن -->
    <text x="150" y="242" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">APEX 5 INCH SHORTS</text>
    <text x="150" y="258" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle" font-family="sans-serif">BREATHABLE PERF</text>
