<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=mokamel/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوپراستور ورزشی و مکمل‌های تخصصی</title>
    <script>
        window.location.replace("mokamel/index.html");
    </script>
    <style>
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loading-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 229, 255, 0.2);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <h2>در حال انتقال به فروشگاه تخصصی مکمل و بدنسازی...</h2>
        <p>اگر صفحه به طور خودکار باز نشد، <a href="mokamel/index.html">اینجا را لمس کنید</a>.</p>
    </div>
</body>
</html>
