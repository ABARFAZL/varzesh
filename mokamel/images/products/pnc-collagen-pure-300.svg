    <linearGradient id="labelGrad_pnc-collagen-pure-300" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#831843"/>
