      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f472b6" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad_pnc-collagen-pure-300" x1="0%" y1="0%" x2="100%" y2="0%">
