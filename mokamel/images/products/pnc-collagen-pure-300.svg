    <line x1="80" y1="160" x2="220" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="150" y="195" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">PURE COLLAGEN PEPTIDES</text>
