      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="85%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="capGrad_pnc-collagen-pure-300" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#000000"/>
