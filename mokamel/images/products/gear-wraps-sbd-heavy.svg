<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_gear-wraps-sbd-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="wrapGrad_gear-wraps-sbd-heavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="325" rx="75" ry="15" fill="#000000" opacity="0.6" filter="url(#shadow_gear-wraps-sbd-heavy)"/>
  <g filter="url(#shadow_gear-wraps-sbd-heavy)">
    <!-- بدنه مچ‌بند / بندلیفت نواری ضخیم -->
    <rect x="80" y="100" width="140" height="150" rx="16" fill="url(#wrapGrad_gear-wraps-sbd-heavy)" stroke="#ef4444" stroke-width="2"/>
    <!-- بافت کشباف تار و پود -->
    <line x1="80" y1="130" x2="220" y2="130" stroke="#ef4444" stroke-width="4"/>
    <line x1="80" y1="160" x2="220" y2="160" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="80" y1="190" x2="220" y2="190" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="80" y1="220" x2="220" y2="220" stroke="#ef4444" stroke-width="4"/>
    <!-- چسب ولکرو و پچ برند -->
    <rect x="100" y="145" width="100" height="60" rx="8" fill="#020617" stroke="#ffffff" stroke-width="1.5"/>
    <text x="150" y="172" font-size="14" font-weight="900" fill="#ef4444" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">SBD Apparel</text>
    <text x="150" y="192" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">MAXIMUM CAST RIGIDITY</text>
    <text x="150" y="290" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif">HEAVY WRIST WRAPS 60CM</text>
  </g>
</svg>