<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_myprotein-creapure-500" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad_myprotein-creapure-500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="38%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="capGrad_myprotein-creapure-500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="labelGrad_myprotein-creapure-500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="highlight_myprotein-creapure-500" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- سایه بیضی کف محصول -->
  <ellipse cx="150" cy="335" rx="90" ry="16" fill="#000000" opacity="0.6" filter="url(#shadow_myprotein-creapure-500)"/>

  <!-- بدنه کیسه ایستاده -->
  <g filter="url(#shadow_myprotein-creapure-500)">
    <path d="M75,90 L225,90 L240,320 L60,320 Z" fill="url(#bodyGrad_myprotein-creapure-500)"/>
    <path d="M75,90 Q150,75 225,90 L230,110 L70,110 Z" fill="#0284c7"/>
    <!-- خط زیپ کیپ -->
    <line x1="72" y1="102" x2="228" y2="102" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <!-- لیبل روی کیسه -->
    <rect x="75" y="125" width="150" height="175" rx="8" fill="url(#labelGrad_myprotein-creapure-500)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="75" y="125" width="150" height="12" fill="#38bdf8"/>
    <!-- متن‌ها -->
    <text x="150" y="160" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">MYPROTEIN</text>
    <line x1="95" y1="170" x2="205" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="150" y="200" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">CREAPURE® CREATINE</text>
    <text x="150" y="222" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">GERMAN HIGHEST PURITY</text>
    <rect x="90" y="238" width="120" height="24" rx="4" fill="#38bdf8" opacity="0.9"/>
    <text x="150" y="254" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" font-family="sans-serif">99.99% ULTRA PURE</text>
    <text x="150" y="284" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">500g • UNFLAVOURED</text>
  </g>
</svg>