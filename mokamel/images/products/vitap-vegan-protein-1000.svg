<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_vitap-vegan-protein-1000" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#34d399" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad_vitap-vegan-protein-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="38%" stop-color="#064e3b"/>
      <stop offset="75%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="capGrad_vitap-vegan-protein-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="labelGrad_vitap-vegan-protein-1000" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="highlight_vitap-vegan-protein-1000" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- سایه بیضی کف محصول -->
  <ellipse cx="150" cy="335" rx="90" ry="16" fill="#000000" opacity="0.6" filter="url(#shadow_vitap-vegan-protein-1000)"/>

  <!-- قوطی پودر استاندارد ۲ پوند تا ۵ پوند -->
  <g filter="url(#shadow_vitap-vegan-protein-1000)">
    <!-- درپوش عریض و شیاردار -->
    <rect x="82" y="44" width="136" height="36" rx="6" fill="url(#capGrad_vitap-vegan-protein-1000)"/>
    <ellipse cx="150" cy="44" rx="68" ry="14" fill="url(#capGrad_vitap-vegan-protein-1000)"/>
    <!-- شیارهای روی درپوش -->
    <line x1="95" y1="50" x2="95" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="108" y1="50" x2="108" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="122" y1="50" x2="122" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="136" y1="50" x2="136" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="150" y1="50" x2="150" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="164" y1="50" x2="164" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="178" y1="50" x2="178" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="192" y1="50" x2="192" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="205" y1="50" x2="205" y2="76" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- گردن قوطی -->
    <rect x="92" y="78" width="116" height="12" fill="#080c14"/>
    <!-- شانه و بدنه عضلانی قوطی -->
    <path d="M92,90 C60,98 50,118 50,140 L50,305 Q150,335 250,305 L250,140 C250,118 240,98 208,90 Z" fill="url(#bodyGrad_vitap-vegan-protein-1000)"/>
    <!-- بازتاب نور شیشه/پلاستیک براق روی شانه و چپ بدنه -->
    <path d="M62,115 L62,298 Q90,315 105,305 L105,115 Z" fill="url(#highlight_vitap-vegan-protein-1000)"/>
    <!-- برچسب لیبل سراسری قوطی -->
    <rect x="50" y="130" width="200" height="165" fill="url(#labelGrad_vitap-vegan-protein-1000)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="50" y="130" width="200" height="12" fill="#34d399"/>
    <!-- متن‌های لیبل -->
    <text x="150" y="165" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="2">VITAP FIT</text>
    <line x1="75" y1="176" x2="225" y2="176" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="150" y="208" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial Black, sans-serif">VEGAN PROTEIN</text>
    <text x="150" y="232" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle" font-family="sans-serif">PEA & SOY BLEND</text>
    <!-- روبان تاییدیه اورجینال -->
    <rect x="75" y="248" width="150" height="24" rx="4" fill="#34d399"/>
    <text x="150" y="264" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" font-family="sans-serif" letter-spacing="1">100% PLANT BASED</text>
    <text x="150" y="288" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">DAIRY FREE • ORGANIC</text>
  </g>
</svg>