<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_gear-shaker-vortex-electric" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bodyGrad_gear-shaker-vortex-electric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad_gear-shaker-vortex-electric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="70" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_gear-shaker-vortex-electric)"/>
  <g filter="url(#shadow_gear-shaker-vortex-electric)">
    <!-- درپوش و دهانه شیکر -->
    <path d="M125,45 L175,45 L180,65 L120,65 Z" fill="#a855f7"/>
    <rect x="140" y="32" width="20" height="15" rx="3" fill="#ffffff" opacity="0.9"/>
    <!-- درپوش پیچ دار -->
    <rect x="90" y="65" width="120" height="30" rx="6" fill="#1e293b"/>
    <rect x="85" y="90" width="130" height="12" rx="3" fill="#a855f7"/>
    <!-- بدنه مخروطی ملایم شیکر -->
    <path d="M92,102 L105,310 Q150,325 195,310 L208,102 Z" fill="url(#bodyGrad_gear-shaker-vortex-electric)"/>
    <!-- نوار مدرج سی سی -->
    <line x1="185" y1="130" x2="195" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="182" y1="160" x2="195" y2="160" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="185" y1="190" x2="195" y2="190" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="182" y1="220" x2="195" y2="220" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="185" y1="250" x2="195" y2="250" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- لوگو و برند روی شیکر -->
    <rect x="110" y="150" width="80" height="80" rx="8" fill="rgba(0,0,0,0.4)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="150" y="180" font-size="14" font-weight="900" fill="#a855f7" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Voltrx</text>
    <text x="150" y="200" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">ELECTRIC MOTOR SHAKER</text>
    <text x="150" y="218" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">LUMP-FREE MIXING</text>
  </g>
</svg>