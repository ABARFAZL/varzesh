<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_gear-chalk-liquid-250" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f8fafc" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="canGrad_gear-chalk-liquid-250" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="335" rx="55" ry="14" fill="#000000" opacity="0.6" filter="url(#shadow_gear-chalk-liquid-250)"/>
  <g filter="url(#shadow_gear-chalk-liquid-250)">
    <!-- نازل اسپری -->
    <rect x="142" y="45" width="16" height="20" rx="3" fill="#cbd5e1"/>
    <path d="M138,55 L130,52 L130,58 Z" fill="#f8fafc"/>
    <!-- درپوش شفاف -->
    <rect x="125" y="65" width="50" height="25" rx="4" fill="#f8fafc" opacity="0.7"/>
    <!-- بدنه اسپری آلومینیومی -->
    <rect x="105" y="90" width="90" height="230" rx="14" fill="url(#canGrad_gear-chalk-liquid-250)"/>
    <!-- لیبل روی قوطی -->
    <rect x="110" y="130" width="80" height="150" rx="8" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="150" y="160" font-size="13" font-weight="900" fill="#f8fafc" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">Beast Gear</text>
    <text x="150" y="185" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">LIQUID CHALK 250ML</text>
    <text x="150" y="210" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle" font-family="sans-serif">PURE MAGNESIUM CARBONATE</text>
    <rect x="118" y="235" width="64" height="20" rx="3" fill="#f8fafc"/>
    <text x="150" y="249" font-size="9" font-weight="900" fill="#000000" text-anchor="middle" font-family="sans-serif">FAST DRYING & DUST FREE</text>
  </g>
